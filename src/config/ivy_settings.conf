<ivysettings>
  <properties file="${ivy.settings.dir}/ivy.properties"/>
  <settings defaultResolver="default-chain"/>
  <resolvers>
    <chain name="default-chain">
      <filesystem name="local">
        <ivy pattern="${ivy.local.default.root}/[organisation]/[module]/[revision]/ivys/ivy.xml"/>
        <artifact pattern="${ivy.local.default.root}/[organisation]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]"/>
      </filesystem>
      <ibiblio name="public" m2compatible="true"/>
    </chain>
  </resolvers>
</ivysettings>