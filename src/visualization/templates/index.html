
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Real-time Visualization System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .visualization-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .viz-card {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            flex: 1;
            min-width: 300px;
        }
        .viz-card h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            color: #2c3e50;
        }
        .viz-image {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            margin-top: 10px;
            cursor: pointer;
        }
        .controls {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }
        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a252f;
        }
        .channel-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .channel-checkbox {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }
        .channel-checkbox input {
            width: auto;
            margin-right: 5px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        .refresh-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
        }
        .auto-refresh input {
            width: auto;
            margin-right: 5px;
        }
        .data-source-info {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background-color: #f0f7ff;
        }
        .data-source-info.active {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        .data-source-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #2c3e50;
            color: white;
            font-size: 12px;
            margin-left: 10px;
        }
        .multi-viz-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .slider-container input[type="range"] {
            flex-grow: 1;
            margin: 0 10px;
        }
        .slider-value {
            min-width: 40px;
            text-align: center;
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            margin-right: 5px;
        }
        .tab.active {
            background-color: #fff;
            border-color: #ddd;
            color: #2c3e50;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .signal-quality-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .signal-good {
            background-color: #4CAF50;
        }
        .signal-medium {
            background-color: #FFC107;
        }
        .signal-poor {
            background-color: #F44336;
        }
        .time-marker {
            position: absolute;
            width: 2px;
            background-color: red;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .time-marker-label {
            position: absolute;
            background-color: rgba(255,0,0,0.7);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 11;
        }
        .viz-container {
            position: relative;
        }
        .overlay-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 5px;
        }
        .overlay-btn {
            background-color: rgba(44, 62, 80, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .overlay-btn:hover {
            background-color: rgba(44, 62, 80, 0.9);
        }
        .advanced-options {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .advanced-options-toggle {
            cursor: pointer;
            color: #2c3e50;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .advanced-options-toggle::after {
            content: '▼';
            margin-left: 5px;
            font-size: 10px;
        }
        .advanced-options-toggle.collapsed::after {
            content: '►';
        }
        .advanced-options-content {
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EEG Real-time Visualization System</h1>
        </div>
        <div id="app"></div>
    </div>
    <script src="/static/app.js"></script>
    <script src="/static/websocket_client.js"></script>
</body>
</html>
